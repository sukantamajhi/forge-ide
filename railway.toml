# Railway: deploys the landing page (the Rust editor itself is not hosted).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.site"
# Redeploy only when the site or its image changes, not for every Rust commit.
watchPatterns = ["site/**", "Dockerfile.site", "Dockerfile.site.dockerignore", "railway.toml"]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
